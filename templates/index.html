<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>国道踏破アプリ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body {
    margin: 0;
    font-family: sans-serif;
}

#panel {
    padding: 10px;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

#map {
    height: 90vh;
}

button {
    font-size: 16px;
    padding: 8px 12px;
}

#info {
    margin-left: 10px;
}
</style>
</head>

<body>

<div id="panel">
    <button onclick="startTracking()">追跡開始</button>
    <button onclick="stopTracking()">追跡停止</button>
    <span id="info">停止中</span>
    <span id="progress" style="margin-left:20px;">
    踏破率計算中...
    </span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([35.68, 139.76], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

let userMarker = null;
let roadsLayer = null;
let gpsLayer = null;
let trackingId = null;
let tracking = false;

async function drawRoads() {

    const res = await fetch("/roads");
    const data = await res.json();

    if (roadsLayer) {
        map.removeLayer(roadsLayer);
    }

    roadsLayer = L.geoJSON(data, {

        style: function(feature) {

            const isVisited = feature.properties.visited;

            return {
                color: isVisited ? "green" : "red",
                weight: isVisited ? 5 : 2,
                opacity: 1.0
            };
        },

        onEachFeature: function(feature, layer) {

            layer.bindPopup(
                "路線: " + feature.properties.rosen_name +
                "<br>リンクID: " + feature.properties.link_id +
                "<br>踏破: " +
                (feature.properties.visited ? "済" : "未")
            );
        }

    }).addTo(map);
}

drawRoads();
drawGpsLog();
updateProgress();


 function startTracking() {

    if (tracking) {
        return;
    }

    tracking = true;

    document.getElementById("info").innerText =
    "GPS追跡中";

    getLocation();

    trackingId = setInterval(
        getLocation,
        5000
    );
}


function stopTracking() {

    if (!tracking) {
            return;
        }

        clearInterval(
            trackingId
        );

        tracking = false;

        document.getElementById("info").innerText =
            "停止中";
    }

        
async function drawGpsLog() {

    const res = await fetch("/gps_log");
    const data = await res.json();

    if (gpsLayer) {
        map.removeLayer(gpsLayer);
    }

    if (data.length < 2) {
        return;
    }

    const latlngs = data.map(p => [
        p.lat,
        p.lon
    ]);

    gpsLayer = L.polyline(
        latlngs,
        {
            color: "blue",
            weight: 4
        }
    ).addTo(map);
}

async function updateProgress() {

    const res = await fetch("/progress");
    const data = await res.json();

    document.getElementById("progress").innerText =
        `踏破率 ${data.percent}% (${(data.visited_m/1000).toFixed(2)}km / ${(data.total_m/1000).toFixed(2)}km)`;
}

async function getLocation() {
  

    if (!navigator.geolocation) {
        alert("GPS非対応です");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        async function(pos) {

            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            if (userMarker) {
                map.removeLayer(userMarker);
            }

            userMarker = L.marker([lat, lon]).addTo(map);

            map.setView([lat, lon], 15);

            const nearestRes = await fetch("/nearest", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    lat: lat,
                    lon: lon
                })
            });

            const nearestData = await nearestRes.json();

            const visitRes = await fetch("/visit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    lat: lat,
                    lon: lon
                })
            });

            await visitRes.json();

            await fetch("/log", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    lat: lat,
                    lon: lon
                })
            });


           document.getElementById("info").innerText =
                "追跡中 | 国道: " +
                nearestData.road +
                " / 距離: " +
                nearestData.distance.toFixed(1) +
                "m";

            await drawRoads();
await drawGpsLog();
await updateProgress();
        },

        function(err) {
            alert("GPS取得失敗: " + err.message);
        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}
</script>

</body>
</html>
