<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>国道踏破アプリ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body {
    margin: 0;
    font-family: sans-serif;
}

#panel {
    padding: 10px;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

#map {
    height: 90vh;
}

button {
    font-size: 16px;
    padding: 8px 12px;
}

#info {
    margin-left: 10px;
}
</style>
</head>

<body>

<div id="panel">
    <button onclick="getLocation()">現在地取得</button>
    <span id="info">未取得</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// =========================
// 地図初期化
// =========================
const map = L.map('map').setView([35.68, 139.76], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

// =========================
// マーカー・レイヤー
// =========================
let userMarker = null;
let roadsLayer = null;

// =========================
// 国道GeoJSON取得＆描画
// =========================
fetch("/roads")
.then(res => res.json())
.then(data => {

    roadsLayer = L.geoJSON(data, {

        style: function(feature) {

            const isVisited = feature.properties.visited;

            return {
                color: isVisited ? "green" : "red",
                weight: isVisited ? 4 : 2,
                opacity: isVisited ? 1.0 : 0.6
            };
        },

        onEachFeature: function(feature, layer) {

            layer.on("click", function() {

                alert(
                    "国道ID: " + feature.properties.unique_id + "\n" +
                    "踏破: " + (feature.properties.visited ? "済み" : "未")
                );

            });

        }

    }).addTo(map);

});

// =========================
// 現在地取得＋API呼び出し
// =========================
function getLocation() {

    if (!navigator.geolocation) {
        alert("GPS非対応です");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        // マーカー更新
        if (userMarker) {
            map.removeLayer(userMarker);
        }

        userMarker = L.marker([lat, lon]).addTo(map);

        map.setView([lat, lon], 14);

        // 最寄り国道API
        const res = await fetch("/nearest", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({lat, lon})
        });

        const data = await res.json();

        document.getElementById("info").innerText =
            `国道: ${data.road} / 距離: ${data.distance.toFixed(1)}m`;

    });

}

</script>

</body>
</html>
